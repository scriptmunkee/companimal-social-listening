name = "companimal-social-listening"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# 02:00 collect, hourly enrich, 06:30 rollup + brief (UTC)
crons = ["0 2 * * *", "15 * * * *", "30 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "companimal-social-listening"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "companimal-social-listening-archive"

[ai]
binding = "AI"

[observability]
enabled = true

# Secrets (set with `wrangler secret put`):
# DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD, YOUTUBE_API_KEY, DASHBOARD_PASSWORD, HASH_SALT
