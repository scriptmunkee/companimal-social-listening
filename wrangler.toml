name = "companimal-social-listening"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[triggers]
# 02:00 collect, hourly enrich, 06:30 rollup + brief (UTC)
crons = ["0 2 * * *", "15 * * * *", "30 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "companimal-social-listening"
database_id = "505f8092-8d1a-4858-ad8f-c28f801ae974"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "companimal-social-listening-archive"

[ai]
binding = "AI"

# Health alerts are emailed from alerts@companimal.co.uk (Email Routing) to the
# ALERT_EMAIL secret, which must be a verified Email Routing destination.
[[send_email]]
name = "ALERTS"

[observability]
enabled = true

# Secrets (set with `wrangler secret put`):
# DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD, YOUTUBE_API_KEY, DASHBOARD_PASSWORD, HASH_SALT, ALERT_EMAIL
